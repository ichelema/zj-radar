[package]
name = "zj-radar"
description = "Host CLI for the zj-radar Zellij sidebar: installs the sidebar into Zellij and launches Zellij sessions with it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["zellij", "sidebar", "agent", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/zj-radar-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "zj_radar_cli"

[[bin]]
name = "zj-radar"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kdl = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
