name: E2E

# The live L5 suite (real Zellij in a PTY) runs:
#  - nightly, on both OSes — the broad regression net;
#  - on every PR, ubuntu-only, so the required `e2e (ubuntu-latest)` check
#    always reports. The suite itself runs only when the PR touches what E2E
#    exercises (the plugin, the toolchain/lockfiles,
#    this workflow); otherwise the job passes after the
#    `scope` step. A path filter on the trigger would skip the workflow, and a
#    required check that never reports blocks the merge;
#  - as a release gate: release.yml `uses:` this workflow via workflow_call,
#    so nothing publishes over a red E2E (this replaced the old `tags` trigger,
#    which raced the release instead of gating it);
#  - on demand via workflow_dispatch.
on:
  schedule:
    - cron: "0 7 * * *"   # nightly 07:00 UTC
  workflow_dispatch:
  workflow_call:
  pull_request:

permissions:
  contents: read

env:
  # Zellij 0.46 (the attention API the rail reads) is not in the flake's
  # nixpkgs yet, so the suite runs against the upstream release binary.
  # Drop the download step and this var once 0.46 ships in nixpkgs.
  ZELLIJ_VERSION: v0.46.0

# A force-push to a PR shouldn't stack serial PTY suites; never cancel the
# scheduled/release runs.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    strategy:
      fail-fast: false
      # PRs run ubuntu only (fast feedback); nightly and release runs cover
      # both OSes.
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write   # nightly-failure-issue (scheduled runs only)
    steps:
      - uses: actions/checkout@v4
        with:
          # on a PR: the merge commit and its parents, for the diff below
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # Nightly, release and manual runs always run the suite. A PR runs it only
      # when it changes what E2E exercises: HEAD is the PR merged into its
      # base, so HEAD^1..HEAD is exactly what the PR changes.
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(crates/plugin/|Cargo\.lock$|justfile$|flake\.nix$|flake\.lock$|\.github/workflows/e2e\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped: this PR changes nothing the live suite exercises"
          fi
      - uses: cachix/install-nix-action@v30
        if: steps.scope.outputs.run == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7
        if: steps.scope.outputs.run == 'true'
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: download zellij ${{ env.ZELLIJ_VERSION }}
        if: steps.scope.outputs.run == 'true'
        # Explicit bash adds pipefail: macOS's bsdtar exits 0 on the empty
        # stream a failed curl leaves, which would pass this step silently.
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) triple=x86_64-unknown-linux-musl ;;
            Darwin-arm64) triple=aarch64-apple-darwin ;;
            *) echo "no zellij release asset mapped for $(uname -sm)"; exit 1 ;;
          esac
          mkdir -p ~/zellij-bin
          curl -LsSf "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/zellij-${triple}.tar.gz" | tar xz -C ~/zellij-bin
      - name: live e2e (L5)
        if: steps.scope.outputs.run == 'true'
        # The release binary goes ahead of the devshell's nixpkgs zellij on PATH.
        # Set inside the devshell: an outer "$PATH" would expand to the
        # runner's PATH and drop the devshell's (just, bats, …).
        run: nix develop -c sh -c 'PATH="$HOME/zellij-bin:$PATH"; zellij --version && just test-e2e'
      - name: file a failure issue (nightly visibility)
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/nightly-failure-issue
        with:
          token: ${{ github.token }}
